name: waxjaw SQLite pin

on:
  push:
    branches: ['waxjaw/**']
  pull_request:

permissions:
  contents: read

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify amalgamation hash and CSQLite flags
        run: sh .github/waxjaw/check-sqlite-pin.sh
